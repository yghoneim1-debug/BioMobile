<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BioMastery — Mobile Interactive Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    /* =========================================================================
       THEME TOKENS: Burgundy (Default), Forest Sage, Ocean Slate, White/Black
       ========================================================================= */
    :root, [data-theme="burgundy"] {
      --bg-outer: #f2e8eb;
      --bg-page: #fbf8f9;
      --bg-card: #ffffff;
      --bg-subtle: #f6ecef;
      --bg-muted: #eedce1;
      --border-color: #e4c9d1;
      --border-strong: #c897a6;
      --text-main: #1f0e14;
      --text-secondary: #58323f;
      --text-muted: #8a5e6c;
      --primary: #7a1c32;
      --primary-hover: #611426;
      --primary-fg: #ffffff;
      --primary-soft: #f5ebee;
      --primary-soft-border: #dcb4c0;
      --primary-text: #7a1c32;
      --svg-ink: #1f0e14;
      --svg-accent: #9f1239;
      --svg-fill: #fbf8f9;
      --glow-color: rgba(122, 28, 50, 0.25);
    }

    [data-theme="forest"] {
      --bg-outer: #e5efe9;
      --bg-page: #f6faf8;
      --bg-card: #ffffff;
      --bg-subtle: #ebf3ef;
      --bg-muted: #dce9e2;
      --border-color: #c2d9cd;
      --border-strong: #93b8a5;
      --text-main: #0e2118;
      --text-secondary: #315242;
      --text-muted: #5c7d6d;
      --primary: #1b5e43;
      --primary-hover: #134732;
      --primary-fg: #ffffff;
      --primary-soft: #e6f4ed;
      --primary-soft-border: #9fd3b8;
      --primary-text: #1b5e43;
      --svg-ink: #0e2118;
      --svg-accent: #b91c1c;
      --svg-fill: #f6faf8;
      --glow-color: rgba(27, 94, 67, 0.25);
    }

    [data-theme="ocean"] {
      --bg-outer: #e3ebf6;
      --bg-page: #f5f8fc;
      --bg-card: #ffffff;
      --bg-subtle: #eaf0f8;
      --bg-muted: #dae4f2;
      --border-color: #bfd0e6;
      --border-strong: #8eaad1;
      --text-main: #0d1b2e;
      --text-secondary: #2d4769;
      --text-muted: #5a7699;
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --primary-fg: #ffffff;
      --primary-soft: #e8effc;
      --primary-soft-border: #a5bdfa;
      --primary-text: #1e40af;
      --svg-ink: #0d1b2e;
      --svg-accent: #dc2626;
      --svg-fill: #f5f8fc;
      --glow-color: rgba(30, 64, 175, 0.25);
    }

    /* Single Monochrome Dark Theme: White / Black */
    [data-theme="white-black"] {
      --bg-outer: #000000;
      --bg-page: #09090b;
      --bg-card: #121215;
      --bg-subtle: #18181b;
      --bg-muted: #27272a;
      --border-color: #27272a;
      --border-strong: #52525b;
      --text-main: #fafafa;
      --text-secondary: #d4d4d8;
      --text-muted: #a1a1aa;
      --primary: #ffffff;
      --primary-hover: #e4e4e7;
      --primary-fg: #09090b;
      --primary-soft: #1f1f23;
      --primary-soft-border: #71717a;
      --primary-text: #ffffff;
      --svg-ink: #fafafa;
      --svg-accent: #ffffff;
      --svg-fill: #18181b;
      --glow-color: rgba(255, 255, 255, 0.22);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-outer);
      color: var(--text-main);
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Mobile App Shell centered cleanly on wider screens */
    #app-shell {
      min-height: 100dvh;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--bg-page);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }

    /* Theme Utility Classes */
    .t-bg-page { background-color: var(--bg-page); }
    .t-bg-card { background-color: var(--bg-card); }
    .t-bg-subtle { background-color: var(--bg-subtle); }
    .t-bg-muted { background-color: var(--bg-muted); }
    .t-border { border-color: var(--border-color); }
    .t-border-strong { border-color: var(--border-strong); }
    .t-text-main { color: var(--text-main); }
    .t-text-secondary { color: var(--text-secondary); }
    .t-text-muted { color: var(--text-muted); }
    .t-primary-bg { background-color: var(--primary); color: var(--primary-fg); }
    .t-primary-soft { background-color: var(--primary-soft); border-color: var(--primary-soft-border); color: var(--primary-text); }
    .t-primary-text { color: var(--primary-text); }

    /* Animations */
    @keyframes viewEnter {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardStagger {
      0% { opacity: 0; transform: translateY(18px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes springSnap {
      0% { transform: scale(0.9); }
      55% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }

    @keyframes confettiDrop {
      0% { transform: translateY(-10px) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(140px) rotate(360deg) scale(0.4); opacity: 0; }
    }

    .animate-view { animation: viewEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-stagger { opacity: 0; animation: cardStagger 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-snap { animation: springSnap 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-shake { animation: shakeWrong 0.36s ease-in-out; }
    .animate-float { animation: floatSlow 3.4s ease-in-out infinite; }
    .animate-sheet { animation: sheetSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* Touch Drag & Slot Styling */
    .touch-card {
      touch-action: none;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    .touch-card:active {
      transform: scale(0.97);
    }

    .touch-card.is-dragging-source {
      opacity: 0.35;
      transform: scale(0.95);
    }

    .drop-slot {
      min-height: 50px;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .drop-slot.drag-hover {
      background-color: var(--primary-soft) !important;
      border-color: var(--primary) !important;
      border-style: solid !important;
      transform: scale(1.02);
      box-shadow: 0 0 0 3px var(--glow-color);
    }

    .drop-slot.tap-ready {
      border-color: var(--primary) !important;
      background-color: var(--primary-soft);
      box-shadow: 0 0 0 2px var(--glow-color);
    }

    /* Floating Ghost Card under Finger */
    #drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      transform: translate(-50%, -115%) scale(1.03);
      max-width: 300px;
      width: max-content;
      box-shadow: 0 18px 34px -8px rgba(0, 0, 0, 0.32);
    }

    /* Sticky Bottom Answer Tray */
    #bottom-tray {
      position: sticky;
      bottom: 0;
      z-index: 30;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 26px -8px rgba(0, 0, 0, 0.12);
    }

    /* Hide scrollbar on horizontal swipe strip */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .confetti-dot {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 4px;
      animation: confettiDrop 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
  </style>
</head>
<body data-theme="burgundy">

  <div id="app-shell">

    <!-- ===================================================================== -->
    <!-- VIEW 1: MINIMALIST MOBILE LANDING PAGE                                -->
    <!-- ===================================================================== -->
    <section id="landing-view" class="flex-1 flex flex-col justify-between px-5 pt-5 pb-8 animate-view">
      <!-- Top Bar -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl t-primary-bg flex items-center justify-center text-lg shadow-xs">
            🧬
          </div>
          <span class="font-extrabold text-base tracking-tight t-text-main">BioMastery</span>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="toggleSound()" id="landing-sound-btn" aria-label="Toggle Sound"
                  class="w-11 h-11 rounded-2xl t-bg-card t-text-main border t-border flex items-center justify-center text-base active:scale-95 transition">
            🔊
          </button>
          <button onclick="openOptions()" aria-label="Options"
                  class="h-11 px-4 rounded-2xl t-bg-card t-text-main border t-border flex items-center gap-1.5 text-xs font-bold active:scale-95 transition">
            <span>⚙️</span>
            <span>Options</span>
          </button>
        </div>
      </div>

      <!-- Center Hero -->
      <div class="text-center px-2 my-auto py-8">
        <div class="w-20 h-20 mx-auto mb-6 rounded-3xl t-primary-soft border flex items-center justify-center text-4xl shadow-xs animate-float">
          🧬
        </div>

        <h1 class="text-3xl font-extrabold tracking-tight t-text-main mb-2.5">
          Molecular Genetics
        </h1>

        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full t-primary-soft border text-xs font-bold mb-9">
          <span>5 Modules</span>
          <span>&bull;</span>
          <span>17 Marks</span>
        </div>

        <button onclick="openDashboard()"
                class="w-full h-14 rounded-2xl t-primary-bg font-extrabold text-base shadow-lg active:scale-[0.98] transition flex items-center justify-center gap-2.5">
          <span>Start Practice</span>
          <span class="text-lg">→</span>
        </button>
      </div>

      <div class="h-2"></div>
    </section>

    <!-- ===================================================================== -->
    <!-- VIEW 2: ANIMATED QUESTION DASHBOARD                                   -->
    <!-- ===================================================================== -->
    <section id="dashboard-view" class="hidden flex-1 flex flex-col">
      <!-- Sticky Top Header -->
      <header class="sticky top-0 z-30 t-bg-page/95 backdrop-blur-md border-b t-border px-4 py-3 flex items-center justify-between">
        <button onclick="openLanding()"
                class="h-11 px-3.5 rounded-2xl t-bg-card t-text-main border t-border text-xs font-bold flex items-center gap-1.5 active:scale-95 transition">
          <span>←</span>
          <span>Home</span>
        </button>

        <span class="font-extrabold text-sm t-text-main">Modules</span>

        <div class="flex items-center gap-1.5">
          <button onclick="toggleSound()" id="dashboard-sound-btn" aria-label="Toggle Sound"
                  class="w-11 h-11 rounded-2xl t-bg-card t-text-main border t-border flex items-center justify-center text-sm active:scale-95 transition">
            🔊
          </button>
          <button onclick="openOptions()" aria-label="Options"
                  class="w-11 h-11 rounded-2xl t-bg-card t-text-main border t-border flex items-center justify-center text-sm active:scale-95 transition">
            ⚙️
          </button>
        </div>
      </header>

      <!-- Scrollable Dashboard Cards -->
      <main class="flex-1 px-4 py-5 flex flex-col gap-4">
        <!-- Overall Progress Card -->
        <div class="t-bg-card rounded-3xl border t-border p-4 shadow-2xs animate-view">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-extrabold uppercase tracking-wider t-text-muted">Total Score</span>
            <span id="dash-total-text" class="text-sm font-extrabold t-primary-text">0.0 / 17.0</span>
          </div>
          <div class="w-full h-2.5 rounded-full t-bg-subtle overflow-hidden border t-border mb-3.5">
            <div id="dash-total-bar" class="h-full t-primary-bg rounded-full transition-all duration-500" style="width: 0%;"></div>
          </div>
          <button id="dash-reset-btn" onclick="resetAllProgress(true)"
                  class="w-full h-11 rounded-2xl t-bg-subtle t-text-secondary border t-border text-xs font-bold flex items-center justify-center gap-1.5 active:scale-98 transition">
            <span>↺</span>
            <span>Reset All Progress</span>
          </button>
        </div>

        <!-- 5 Module Cards -->
        <div id="dashboard-cards" class="flex flex-col gap-3 pb-6">
          <!-- Injected via JS -->
        </div>
      </main>
    </section>

    <!-- ===================================================================== -->
    <!-- VIEW 3: MOBILE TOUCH PRACTICE WORKSPACE                               -->
    <!-- ===================================================================== -->
    <section id="practice-view" class="hidden flex-1 flex flex-col">
      <!-- Compact Sticky Top Bar -->
      <header class="sticky top-0 z-30 t-bg-page/95 backdrop-blur-md border-b t-border px-3.5 py-2.5">
        <div class="flex items-center justify-between gap-2">
          <button onclick="openDashboard()"
                  class="h-11 px-3 rounded-2xl t-bg-card t-text-main border t-border text-xs font-bold flex items-center gap-1 active:scale-95 transition shrink-0">
            <span>←</span>
            <span>Modules</span>
          </button>

          <!-- Question Pill & Live Score -->
          <div class="flex items-center gap-1.5 px-3 h-11 rounded-2xl t-primary-soft border">
            <span id="ws-q-id" class="text-xs font-extrabold">Q13</span>
            <span class="opacity-40">&bull;</span>
            <span id="ws-q-score" class="text-xs font-extrabold">0.0 / 5.0</span>
          </div>

          <!-- Compact Reset & Key Buttons -->
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="showAnswerKey()" title="Show Key"
                    class="w-11 h-11 rounded-2xl t-bg-card t-text-main border t-border text-sm font-bold flex items-center justify-center active:scale-95 transition">
              👁️
            </button>
            <button onclick="resetCurrentQuestion()" title="Reset Question"
                    class="w-11 h-11 rounded-2xl t-bg-card t-text-main border t-border text-sm font-bold flex items-center justify-center active:scale-95 transition">
              ↺
            </button>
          </div>
        </div>
      </header>

      <!-- Scrollable Question Content Area -->
      <main id="ws-scroll-area" class="flex-1 px-4 pt-4 pb-6 flex flex-col gap-4 animate-view">
        <!-- Prompt Header -->
        <div class="t-bg-card rounded-2xl border t-border p-3.5">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span id="ws-category-tag" class="text-[11px] font-extrabold uppercase tracking-wider t-primary-text">Comparison</span>
            <span id="ws-marks-tag" class="text-[11px] font-bold t-text-muted">5 Marks (0.5 each)</span>
          </div>
          <h2 id="ws-title" class="text-sm font-bold t-text-main leading-snug">
            Differentiate between DNA replication and transcription.
          </h2>
        </div>

        <!-- Exam Mode Check Button (Visible only in Exam Mode) -->
        <button id="ws-exam-check-btn" onclick="checkExamAnswers()"
                class="hidden w-full h-12 rounded-2xl bg-emerald-600 text-white font-extrabold text-sm shadow-sm active:scale-98 transition">
          ✓ Check Answers
        </button>

        <!-- Dynamic Stacked Cards (Q13/Q14) OR SVG Diagram + Slots (Q18/Q19/Q20) -->
        <div id="ws-stage" class="flex flex-col gap-3.5">
          <!-- Rendered via JS -->
        </div>

        <!-- Next Module Button -->
        <button id="ws-next-btn" onclick="goNextQuestion()"
                class="w-full h-12 rounded-2xl t-primary-bg font-extrabold text-sm shadow-sm active:scale-98 transition flex items-center justify-center gap-2 mt-1">
          <span>Next Module</span>
          <span>→</span>
        </button>
      </main>

      <!-- =================================================================== -->
      <!-- STICKY THUMB-ZONE BOTTOM ANSWER TRAY                                -->
      <!-- =================================================================== -->
      <div id="bottom-tray" class="t-bg-card border-t t-border px-3.5 pt-2.5 rounded-t-3xl">
        <!-- Tray Header -->
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-extrabold uppercase tracking-wider t-text-main">Answers</span>
            <span id="tray-count" class="px-2 py-0.5 rounded-full text-[11px] font-extrabold t-primary-soft border">10</span>
          </div>

          <div class="flex items-center gap-2">
            <span id="tray-hint" class="text-[11px] font-semibold t-text-muted">Drag or tap card</span>
            <button onclick="shuffleTray()"
                    class="h-8 px-2.5 rounded-xl t-bg-subtle t-text-secondary border t-border text-[11px] font-bold active:scale-95 transition">
              🔀 Shuffle
            </button>
            <button onclick="toggleTrayLayout()" id="tray-layout-btn"
                    class="h-8 px-2.5 rounded-xl t-bg-subtle t-text-secondary border t-border text-[11px] font-bold active:scale-95 transition">
              ↕ Expand
            </button>
          </div>
        </div>

        <!-- Answer Cards Container (Horizontal Swipe Strip by default, Expandable to Vertical List) -->
        <div id="tray-cards"
             class="flex flex-row gap-2.5 overflow-x-auto no-scrollbar pb-1.5 items-stretch">
          <!-- Touch-draggable / Tappable cards injected here -->
        </div>
      </div>
    </section>

  </div>

  <!-- Floating Ghost Element for Custom Touch Dragging -->
  <div id="drag-ghost" class="hidden px-3.5 py-2.5 rounded-2xl t-primary-bg font-semibold text-xs leading-snug border border-white/20"></div>

  <!-- ======================================================================= -->
  <!-- MOBILE BOTTOM SHEET: OPTIONS & THEMES                                   -->
  <!-- ======================================================================= -->
  <div id="options-sheet" onclick="closeOptions(event)" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end justify-center">
    <div onclick="event.stopPropagation()" class="w-full max-w-[480px] t-bg-card t-text-main rounded-t-3xl border-t t-border p-5 pb-8 animate-sheet">
      <!-- Handle bar -->
      <div class="w-10 h-1.5 rounded-full t-bg-muted mx-auto mb-4"></div>

      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-extrabold">Options</h3>
        <button onclick="closeOptions()" class="w-9 h-9 rounded-full t-bg-subtle flex items-center justify-center text-xs font-bold">✕</button>
      </div>

      <!-- Theme Selection -->
      <div class="mb-5">
        <span class="block text-[11px] font-extrabold uppercase tracking-wider t-text-muted mb-2">Theme</span>
        <div id="theme-grid" class="grid grid-cols-2 gap-2">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- Feedback Mode & Sound -->
      <div class="grid grid-cols-2 gap-2.5 mb-5">
        <div>
          <span class="block text-[11px] font-extrabold uppercase tracking-wider t-text-muted mb-2">Feedback</span>
          <div class="flex rounded-2xl t-bg-subtle p-1 border t-border h-11">
            <button id="opt-instant" onclick="setGradingMode('instant')" class="flex-1 rounded-xl text-xs font-bold transition">Instant</button>
            <button id="opt-exam" onclick="setGradingMode('exam')" class="flex-1 rounded-xl text-xs font-bold transition">Exam</button>
          </div>
        </div>

        <div>
          <span class="block text-[11px] font-extrabold uppercase tracking-wider t-text-muted mb-2">Sound</span>
          <button id="opt-sound" onclick="toggleSound()" class="w-full h-11 rounded-2xl border text-xs font-bold flex items-center justify-center gap-1.5 transition">
            <span>🔊</span>
            <span>On</span>
          </button>
        </div>
      </div>

      <button onclick="closeOptions()" class="w-full h-12 rounded-2xl t-primary-bg font-extrabold text-sm active:scale-98 transition">
        Done
      </button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SOUND ENGINE & HAPTICS (UNLOCKED ON FIRST TOUCH)
    // =========================================================================
    let soundEnabled = localStorage.getItem('biomastery_mobile_sound') !== 'false';
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    document.addEventListener('pointerdown', unlockAudio, { once: true });

    function vibrateDevice(ms) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      unlockAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      if (type === 'pickup') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'drop') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.exponentialRampToValueAtTime(165, now + 0.055);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      } else if (type === 'correct') {
        [523.25, 659.25].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.06;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.11, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.23);
        });
      } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(175, now);
        osc.frequency.exponentialRampToValueAtTime(115, now + 0.16);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'complete') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.065;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.11, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.32);
        });
      }
    }

    // =========================================================================
    // 4. STATE MANAGEMENT
    // =========================================================================
    let currentQIdx = 0;
    let gradingMode = 'instant'; // 'instant' | 'exam'
    let selectedCardId = null;
    let trayExpanded = false;
    const stateMap = {};

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getSlots(q) {
      return q.type === 'comparison'
        ? q.features.flatMap(f => [f.slotA, f.slotB])
        : q.slots;
    }

    function initQuestion(q) {
      const slots = getSlots(q);
      const cards = {};
      const ids = [];
      slots.forEach((s, i) => {
        const cid = `${q.id}_c_${i}`;
        cards[cid] = { id: cid, text: s.answer };
        ids.push(cid);
      });
      stateMap[q.id] = {
        bank: shuffle(ids),
        placed: {}, // slotId -> cardId
        checked: false,
        cards
      };
    }

    QUESTIONS.forEach(initQuestion);

    function checkSlotCorrect(q, slot) {
      const cid = stateMap[q.id].placed[slot.id];
      if (!cid) return null;
      return stateMap[q.id].cards[cid]?.text === slot.answer;
    }

    function getQScore(q) {
      let count = 0;
      getSlots(q).forEach(s => {
        if (checkSlotCorrect(q, s) === true) count++;
      });
      return count * q.markPerSlot;
    }

    function getTotalScore() {
      return QUESTIONS.reduce((acc, q) => acc + getQScore(q), 0);
    }

    // =========================================================================
    // 6. CUSTOM MOBILE POINTER DRAG-AND-DROP + TAP-TO-PLACE
    // =========================================================================
    let activeDrag = null; // { cardId, startX, startY, moved, sourceEl }

    function onCardPointerDown(e, cardId) {
      if (e.button !== undefined && e.button !== 0) return;
      // Ignore if tapping the remove '×' button inside a filled slot
      if (e.target.closest('.remove-card-btn')) return;

      unlockAudio();
      activeDrag = {
        cardId,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        sourceEl: e.currentTarget
      };
    }

    window.addEventListener('pointermove', (e) => {
      if (!activeDrag) return;
      const dx = e.clientX - activeDrag.startX;
      const dy = e.clientY - activeDrag.startY;

      if (!activeDrag.moved && Math.hypot(dx, dy) > 8) {
        activeDrag.moved = true;
        selectedCardId = null;
        playSound('pickup');
        vibrateDevice(12);

        const q = QUESTIONS[currentQIdx];
        const card = stateMap[q.id].cards[activeDrag.cardId];
        const ghost = document.getElementById('drag-ghost');
        ghost.textContent = card.text;
        ghost.classList.remove('hidden');
        if (activeDrag.sourceEl) activeDrag.sourceEl.classList.add('is-dragging-source');
      }

      if (activeDrag.moved) {
        e.preventDefault();
        const ghost = document.getElementById('drag-ghost');
        ghost.style.left = `${e.clientX}px`;
        ghost.style.top = `${e.clientY}px`;

        // Highlight drop slot directly beneath finger
        document.querySelectorAll('.drop-slot.drag-hover').forEach(el => el.classList.remove('drag-hover'));
        const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
        const slotEl = elemBelow ? elemBelow.closest('[data-slot-id]') : null;
        if (slotEl) {
          slotEl.classList.add('drag-hover');
        }
      }
    }, { passive: false });

    window.addEventListener('pointerup', (e) => {
      if (!activeDrag) return;
      const { cardId, moved, sourceEl } = activeDrag;
      activeDrag = null;

      const ghost = document.getElementById('drag-ghost');
      ghost.classList.add('hidden');
      if (sourceEl) sourceEl.classList.remove('is-dragging-source');
      document.querySelectorAll('.drop-slot.drag-hover').forEach(el => el.classList.remove('drag-hover'));

      if (moved) {
        const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
        const slotEl = elemBelow ? elemBelow.closest('[data-slot-id]') : null;
        const trayEl = elemBelow ? elemBelow.closest('#bottom-tray') : null;

        if (slotEl) {
          placeCardInSlot(cardId, slotEl.getAttribute('data-slot-id'));
        } else if (trayEl) {
          returnCardToTray(cardId);
        }
      } else {
        // Pure tap on card -> toggle selection for instant Tap-to-Place
        handleCardTap(cardId);
      }
    });

    function handleCardTap(cardId) {
      playSound('pickup');
      vibrateDevice(8);
      selectedCardId = selectedCardId === cardId ? null : cardId;
      renderWorkspace();
    }

    function handleSlotTap(slotId) {
      const q = QUESTIONS[currentQIdx];
      const st = stateMap[q.id];

      if (selectedCardId) {
        const cid = selectedCardId;
        selectedCardId = null;
        placeCardInSlot(cid, slotId);
      } else if (st.placed[slotId]) {
        handleCardTap(st.placed[slotId]);
      }
    }

    function placeCardInSlot(cardId, targetSlotId) {
      const q = QUESTIONS[currentQIdx];
      const st = stateMap[q.id];
      const prevScore = getQScore(q);

      // Find if card came from another slot
      let originSlotId = null;
      for (const [sId, cId] of Object.entries(st.placed)) {
        if (cId === cardId) {
          originSlotId = sId;
          break;
        }
      }

      const displacedCardId = st.placed[targetSlotId];
      st.bank = st.bank.filter(id => id !== cardId);

      if (originSlotId) {
        if (displacedCardId) {
          st.placed[originSlotId] = displacedCardId;
        } else {
          delete st.placed[originSlotId];
        }
      } else if (displacedCardId) {
        st.bank.push(displacedCardId);
      }

      st.placed[targetSlotId] = cardId;

      if (gradingMode === 'exam') {
        st.checked = false;
        playSound('drop');
        vibrateDevice(10);
      } else {
        const slotObj = getSlots(q).find(s => s.id === targetSlotId);
        const ok = slotObj && checkSlotCorrect(q, slotObj);
        const newScore = getQScore(q);
        if (ok && newScore === q.marks && prevScore < q.marks) {
          playSound('complete');
          vibrateDevice([25, 40, 40]);
          burstConfetti();
        } else if (ok) {
          playSound('correct');
          vibrateDevice(15);
        } else {
          playSound('wrong');
          vibrateDevice([30, 30, 30]);
        }
      }

      renderWorkspace(targetSlotId);
    }

    function returnCardToTray(cardId, e) {
      if (e) e.stopPropagation();
      playSound('drop');
      vibrateDevice(8);
      const q = QUESTIONS[currentQIdx];
      const st = stateMap[q.id];

      for (const [sId, cId] of Object.entries(st.placed)) {
        if (cId === cardId) delete st.placed[sId];
      }
      if (!st.bank.includes(cardId)) st.bank.push(cardId);
      if (selectedCardId === cardId) selectedCardId = null;
      if (gradingMode === 'exam') st.checked = false;

      renderWorkspace();
    }

      QUESTIONS.forEach(initQuestion);
      selectedCardId = null;
      renderDashboard(false);
      if (feedback) {
        const btn = document.getElementById('dash-reset-btn');
        if (btn) {
          btn.innerHTML = '<span>✓</span><span>All Reset!</span>';
          setTimeout(() => {
            btn.innerHTML = '<span>↺</span><span>Reset All Progress</span>';
          }, 1100);
        }
      }
    }

    // =========================================================================
    // 8. MOBILE-FIRST RENDERERS (STACKED COMPARISON CARDS + CRISP SVGs)
    // =========================================================================
    function renderSlotBox(q, slot, snapSlotId, prefixBadge = '') {
      const st = stateMap[q.id];
      const placedId = st.placed[slot.id];
      const showCheck = gradingMode === 'instant' || st.checked;

      if (!placedId) {
        const readyClass = selectedCardId ? 'tap-ready' : 't-bg-subtle t-border-strong';
        return `
          <div data-slot-id="${slot.id}"
               onclick="handleSlotTap('${slot.id}')"
               class="drop-slot ${readyClass} w-full rounded-2xl border-2 border-dashed px-3.5 py-3 flex items-center justify-between gap-2 cursor-pointer">
            <div class="flex items-center gap-2">
              ${prefixBadge}
              <span class="text-xs font-semibold ${selectedCardId ? 't-primary-text font-bold' : 't-text-muted'}">
                ${selectedCardId ? 'Tap here to place' : 'Drop or tap to place'}
              </span>
            </div>
            <span class="text-xs opacity-40">+</span>
          </div>
        `;
      }

      const card = st.cards[placedId];
      const isOk = checkSlotCorrect(q, slot);
      const isSelected = selectedCardId === placedId;
      const anim = snapSlotId === slot.id
        ? (showCheck ? (isOk ? 'animate-snap' : 'animate-shake') : 'animate-snap')
        : '';

      let boxStyle = 't-bg-card t-border-strong t-text-main';
      let statusIcon = '';

      if (showCheck) {
        if (isOk) {
          boxStyle = 'bg-emerald-500/15 border-emerald-500 t-text-main';
          statusIcon = `<span class="w-5 h-5 rounded-full bg-emerald-600 text-white text-[11px] font-extrabold flex items-center justify-center shrink-0">✓</span>`;
        } else {
          boxStyle = 'bg-rose-500/15 border-rose-500 t-text-main';
          statusIcon = `<span class="w-5 h-5 rounded-full bg-rose-600 text-white text-[11px] font-extrabold flex items-center justify-center shrink-0">✕</span>`;
        }
      }

      if (isSelected) {
        boxStyle += ' ring-2 ring-amber-400';
      }

      return `
        <div data-slot-id="${slot.id}"
             onpointerdown="onCardPointerDown(event, '${placedId}')"
             onclick="handleSlotTap('${slot.id}')"
             class="drop-slot touch-card ${anim} w-full rounded-2xl border-2 ${boxStyle} px-3.5 py-2.5 flex items-center justify-between gap-2.5 cursor-pointer">
          <div class="flex items-center gap-2 min-w-0">
            ${prefixBadge}
            ${statusIcon}
            <span class="text-xs font-semibold leading-snug">${card.text}</span>
          </div>
          <button type="button"
                  onclick="returnCardToTray('${placedId}', event)"
                  aria-label="Remove answer"
                  class="remove-card-btn w-7 h-7 rounded-full t-bg-muted t-text-main flex items-center justify-center text-xs font-extrabold shrink-0 active:scale-90 transition">
            ×
          </button>
        </div>
      `;
    }

      const stage = document.getElementById('ws-stage');
      stage.innerHTML = q.features.map((feat, idx) => `

    function renderTray() {
      const q = QUESTIONS[currentQIdx];
      const st = stateMap[q.id];
      const container = document.getElementById('tray-cards');
      const countEl = document.getElementById('tray-count');
      const hintEl = document.getElementById('tray-hint');

      countEl.textContent = st.bank.length;
      hintEl.textContent = selectedCardId ? 'Tap any slot above' : 'Drag or tap card';
      hintEl.className = selectedCardId
        ? 'text-[11px] font-extrabold t-primary-text'
        : 'text-[11px] font-semibold t-text-muted';

      if (trayExpanded) {
        container.className = 'flex flex-col gap-2 max-h-[42dvh] overflow-y-auto pb-1';
      } else {
        container.className = 'flex flex-row gap-2.5 overflow-x-auto no-scrollbar pb-1.5 items-stretch';
      }

      if (st.bank.length === 0) {
        container.innerHTML = `
          <div class="w-full py-4 text-center text-xs font-bold t-text-muted">
            ✓ All answers placed
          </div>
        `;
        return;
      }

      container.innerHTML = st.bank.map(cid => {
        const card = st.cards[cid];
        const isSelected = selectedCardId === cid;
        const widthClass = trayExpanded ? 'w-full' : 'min-w-[215px] max-w-[245px] shrink-0';

        return `
          <div onpointerdown="onCardPointerDown(event, '${cid}')"
               class="touch-card ${widthClass} rounded-2xl border-2 px-3.5 py-3 flex items-center text-left text-xs font-semibold leading-snug cursor-pointer ${
                 isSelected
                   ? 't-primary-bg border-transparent shadow-md ring-2 ring-amber-400'
                   : 't-bg-subtle t-text-main t-border-strong'
               }">
            ${card.text}
          </div>
        `;
      }).join('');
    }

    function renderWorkspace(snapSlotId = null) {
      const q = QUESTIONS[currentQIdx];
      const score = getQScore(q);

      document.getElementById('ws-q-id').textContent = q.id;
      document.getElementById('ws-q-score').textContent = `${score.toFixed(1)} / ${q.marks.toFixed(1)}`;
      document.getElementById('ws-category-tag').textContent = q.category;
      document.getElementById('ws-marks-tag').textContent = `${q.marks} Marks`;
      document.getElementById('ws-title').textContent = q.title;

      const checkBtn = document.getElementById('ws-exam-check-btn');
      checkBtn.classList.toggle('hidden', gradingMode === 'instant');

      const nextBtn = document.getElementById('ws-next-btn');
      nextBtn.innerHTML = currentQIdx < QUESTIONS.length - 1
        ? `<span>Next Module (${QUESTIONS[currentQIdx + 1].id})</span><span>→</span>`
        : `<span>Back to Modules</span><span>✓</span>`;

      if (q.type === 'comparison') {
        renderComparisonCards(q, snapSlotId);
      } else {
        renderDiagramStage(q, snapSlotId);
      }

      renderTray();
    }

    // Boot
    applyTheme(currentTheme);
    updateSoundUI();
    renderDashboard(false);
  </script>
</body>
</html>
